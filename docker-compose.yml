services:
  backend:
    environment:
      CI_REGISTRY_IMAGE: "${CI_REGISTRY_IMAGE}"
      VERSION: "${VERSION}"
    image: ${CI_REGISTRY_IMAGE}/sausage-backend:${VERSION}
    restart: always
    container_name: sausage-store-backend
    ports:
      - "8080:8080"
    networks:
      - sausage-store-network
    healthcheck:
      test: curl --fail -s http://localhost:8080/actuator/health
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 6

  frontend:
    environment:
      CI_REGISTRY_IMAGE: "${CI_REGISTRY_IMAGE}"
      VERSION: "${VERSION}"
      CI_PROJECT_DIR: "${CI_PROJECT_DIR}"
    image: ${CI_REGISTRY_IMAGE}/sausage-frontend:${VERSION}
    restart: always
    container_name: sausage-store-frontend
    volumes:
      - type: bind
        source: /tmp${CI_PROJECT_DIR}/frontend/default.conf
        target: /etc/nginx/conf.d/default.conf

    ports:
      - "80:80"
    networks:
      - sausage-store-network

networks:
  sausage-store-network:
    driver: bridge
