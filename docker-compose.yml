version: "3.8"

services:
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    image: ${CI_REGISTRY_IMAGE}/sausage-backend:${VERSION}
    restart: always
    container_name: sausage-store-backend
    ports:
      - "8080:8080"
    networks:
      - sausage-store-network

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    image: ${CI_REGISTRY_IMAGE}/sausage-frontend:${VERSION}
    restart: always
    container_name: sausage-store-frontend
    volumes:
      - /tmp${CI_PROJECT_DIR}/frontend/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    networks:
      - sausage-store-network

networks:
  sausage-store-network:
    driver: bridge
