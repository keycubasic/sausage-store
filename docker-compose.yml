services:
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    command: '/bin/sh -c "echo $$VERSION"'
    environment:
      CI_REGISTRY_IMAGE: "${CI_REGISTRY_IMAGE}"
      VERSION: "${VERSION}"
    image: ${CI_REGISTRY_IMAGE}/sausage-backend:${VERSION}
    restart: always
    container_name: sausage-store-backend
    ports:
      - "8080:8080"
    networks:
      - sausage-store-network

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    environment:
      CI_REGISTRY_IMAGE: "${CI_REGISTRY_IMAGE}"
      VERSION: "${VERSION}"
      CI_PROJECT_DIR: "${CI_PROJECT_DIR}"
    image: ${CI_REGISTRY_IMAGE}/sausage-frontend:${VERSION}
    restart: always
    container_name: sausage-store-frontend
    volumes:
      - /tmp${CI_PROJECT_DIR}/frontend/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    networks:
      - sausage-store-network

networks:
  sausage-store-network:
    driver: bridge
