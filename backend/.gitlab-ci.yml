include:
  - template: Security/SAST.gitlab-ci.yml

variables:
  VERSION: 1.0.${CI_PIPELINE_ID}
  JAVA_OPTS: -XX:MaxRAMPercentage=90

cache:
  paths:
    - ${MAVEN_REPO_PATH}

stages:
  - build
  - test
  - release
  - notify

build-backend-code-job:
  stage: build
  script:
    - cd backend
    - mvn package -Dmaven.repo.local=${MAVEN_REPO_PATH} -Dversion.application=${VERSION}
  artifacts:
    paths:
      - backend/target/sausage-store-${VERSION}.jar
  rules:
#    - if: $CI_COMMIT_MESSAGE =~ /send notification/
    - changes:
        - backend/**/*

semgrep-sast:
  stage: test
  variables:
    COMPILE: ${COMPILE}
    SAST_JAVA_VERSION: ${SAST_JAVA_VERSION}
    MAVEN_REPO_PATH: ${MAVEN_REPO_PATH}
  rules:
    - changes:
        - backend/**/*
  needs:
    - job: build-backend-code-job

sonarqube-backend-sast:
  stage: test
  image: maven:3.8-openjdk-16
  script:
    - cd backend
    - >
      mvn verify sonar:sonar
      -Dsonar.qualitygate.wait=true
      -Dsonar.projectKey=${SONAR_PROJECT_KEY_BACK}
      -Dsonar.projectName=${SONAR_PROJECT_NAME_BACK}
      -Dsonar.host.url=${SONARQUBE_URL}
      -Dsonar.login=${SONAR_LOGIN}
  rules:
    - changes:
        - backend/**/*
  needs:
    - job: build-backend-code-job

upload-backend-release:
  stage: release
  only:
    changes:
      - backend/**/*
  script:
    - cd backend
    - >
      mvn deploy -DskipTests
      -Dmaven.repo.local=${MAVEN_REPO_PATH}
      -s settings.xml -Dversion.application=${VERSION}
  needs:
    - job: sonarqube-backend-sast

telegram-notification-backend:
  stage: notify
  variables:
    WATERMARK: "☺"
  only:
    changes:
      - backend/**/*
  script:
    - >
      curl -X POST
      -H 'Content-type: application/json'
      -d '{"chat_id": "-1002558070233", "text": "Backend uploaded to Nexus '$WATERMARK': '$NEXUS_REPO_URL'/#browse/browse:'$NEXUS_REPO_BACKEND_NAME'"}'
      https://api.telegram.org/bot5933756043:AAE8JLL5KIzgrNBeTP5e-1bkbJy4YRoeGjs/sendMessage
  needs:
    - job: upload-backend-release
