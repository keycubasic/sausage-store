stages:
  - build
  - notify

build-backend-code-job:
  stage: build
  script:
    - cd backend
    - mvn package
  artifacts:
    paths:
      - backend/target/sausage-store-0.0.1-SNAPSHOT.jar
  rules:
#    - if: $CI_COMMIT_MESSAGE =~ /send notification/
      changes:
        - backend/**/*

telegram-notification-backend:
  stage: notify
  only:
    changes:
      - backend/**/*
  script:
    - >
      curl -X POST
      -H 'Content-type: application/json'
      -d '{"chat_id": "-1002558070233", "text": "Backend built: '$CI_PROJECT_URL'/-/jobs/artifacts/'$CI_COMMIT_SHA'/download?job=build-backend-code-job"}'
      https://api.telegram.org/bot5933756043:AAE8JLL5KIzgrNBeTP5e-1bkbJy4YRoeGjs/sendMessage
  needs:
    - job: build-backend-code-job
