include:
  - template: Security/SAST.gitlab-ci.yml

variables:
  VERSION: 1.0.${CI_PIPELINE_ID}
  JAVA_OPTS: -XX:MaxRAMPercentage=90

cache:
  paths:
    - ${MAVEN_REPO_PATH}

stages:
  - build
  - test
  - release
  - deploy
  - notify

build-backend-code-job:
  stage: build
  variables:
    SPRING_FLYWAY_ENABLED: false
  script:
    - cd backend
    - mvn package -Dmaven.repo.local=${MAVEN_REPO_PATH} -Dversion.application=${VERSION}
  artifacts:
    paths:
      - backend/target/sausage-store-${VERSION}.jar
  rules:
#    - if: $CI_COMMIT_MESSAGE =~ /send notification/
    - changes:
        - backend/**/*

semgrep-sast:
  stage: test
  variables:
    COMPILE: ${COMPILE}
    SAST_JAVA_VERSION: ${SAST_JAVA_VERSION}
    MAVEN_REPO_PATH: ${MAVEN_REPO_PATH}
  rules:
    - changes:
        - backend/**/*
  needs:
    - job: build-backend-code-job

sonarqube-backend-sast:
  stage: test
  variables:
    SPRING_FLYWAY_ENABLED: false
  image: maven:3.8-openjdk-16
  script:
    - cd backend
    - >
      mvn verify sonar:sonar
      -Dsonar.qualitygate.wait=true
      -Dsonar.projectKey=${SONAR_PROJECT_KEY_BACK}
      -Dsonar.projectName=${SONAR_PROJECT_NAME_BACK}
      -Dsonar.host.url=${SONARQUBE_URL}
      -Dsonar.login=${SONAR_LOGIN}
      -Dsonar.exclusions=**/*.sql
  rules:
    - changes:
        - backend/**/*
  needs:
    - job: build-backend-code-job

upload-backend-release:
  stage: release
  only:
    changes:
      - backend/**/*
  script:
    - cd backend
    - >
      mvn deploy -DskipTests
      -Dmaven.repo.local=${MAVEN_REPO_PATH}
      -s settings.xml -Dversion.application=${VERSION}
  needs:
    - job: sonarqube-backend-sast

deploy-backend:
  stage: deploy
  when: manual
  environment:
    name: $CI_COMMIT_REF_SLUG
  before_script:
    #устанавливаем ssh-agent для удобства аутентификации по ssh
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    #сохраняем сгенеренный ранее приватный ключ для раннера
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 600 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    #выполняем простую команду для проверки
    - ssh ${DEV_USER}@${DEV_HOST} "id"
    - scp ./backend/backend.service ${DEV_USER}@${DEV_HOST}:/etc/systemd/system/backend.service
    - ssh ${DEV_USER}@${DEV_HOST} "export "CURRENT_VERSION=${VERSION}"; export "VERSION=${VERSION}"; export "DEV_HOST=${DEV_HOST}";export "NEXUS_REPO_URL=${NEXUS_REPO_URL}"; export "NEXUS_REPO_BACKEND_NAME=${NEXUS_REPO_BACKEND_NAME}"; export "NEXUS_REPO_USER=${NEXUS_REPO_USER}"; export "NEXUS_REPO_PASS=${NEXUS_REPO_PASS}";setsid /bin/bash -s " < ./backend/deploy.sh
  needs:
    - job: upload-backend-release

telegram-notification-backend:
  stage: notify
  when: manual
  variables:
    WATERMARK: "☺"
  only:
    changes:
      - backend/**/*
  script:
    - >
      curl -X POST
      -H 'Content-type: application/json'
      -d '{"chat_id": "-1002558070233", "text": "Backend deployed with MongoDB '$WATERMARK'"}'
      https://api.telegram.org/bot5933756043:AAE8JLL5KIzgrNBeTP5e-1bkbJy4YRoeGjs/sendMessage
  needs:
    - job: deploy-backend
