include:
  - template: Security/SAST.gitlab-ci.yml

variables:
  VERSION: 1.0.${CI_PIPELINE_ID}
  JAVA_OPTS: -XX:MaxRAMPercentage=90

cache:
  paths:
    - ${MAVEN_REPO_PATH}

stages:
  - build
  - test
  - release
  - deploy
  - notify

build-backend-code-job:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.9.0-debug
    entrypoint: [""]
  # переменные CI_REGISTRY_USER, CI_REGISTRY_PASSWORD, CI_REGISTRY генерятся Гитлабом, их задавать не надо
  script:
    - echo "test"
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/backend"
      --dockerfile "${CI_PROJECT_DIR}/backend/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}/sausage-backend:$CI_COMMIT_SHA"
      --build-arg VERSION=$VERSION
      --cache=true
#  rules:
#    - changes:
#        - backend/**/*

semgrep-sast:
  stage: test
  variables:
    COMPILE: ${COMPILE}
    SAST_JAVA_VERSION: ${SAST_JAVA_VERSION}
    MAVEN_REPO_PATH: ${MAVEN_REPO_PATH}
#  rules:
#    - changes:
#        - backend/**/*
  needs:
    - job: build-backend-code-job

sonarqube-backend-sast:
  stage: test
  variables:
    SPRING_FLYWAY_ENABLED: false
  image: maven:3.8-openjdk-16
  script:
    - cd backend
    - >
      mvn verify sonar:sonar
      -Dsonar.qualitygate.wait=true
      -Dsonar.projectKey=${SONAR_PROJECT_KEY_BACK}
      -Dsonar.projectName=${SONAR_PROJECT_NAME_BACK}
      -Dsonar.host.url=${SONARQUBE_URL}
      -Dsonar.login=${SONAR_LOGIN}
      -Dsonar.exclusions=**/*.sql
#  rules:
#    - changes:
#        - backend/**/*
  needs:
    - job: build-backend-code-job

upload-backend-release:
  stage: release
  variables:
    GIT_STRATEGY: none
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [ "" ]
  cache: [ ]
  before_script:
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - crane tag $CI_REGISTRY_IMAGE/sausage-backend:$CI_COMMIT_SHA $VERSION
#  only:
#    changes:
#      - backend/**/*
  needs:
    - job: sonarqube-backend-sast

deploy-backend:
  stage: deploy
  when: manual
  image: alpine:3.18
  before_script:
    - apk add openssh-client bash
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
      # подкинуть docker-compose.yml и Dockerfiles
    - scp ./docker-compose.yml ${DEV_USER}@${DEV_HOST}:/tmp${CI_PROJECT_DIR}/docker-compose.yml
  script:
    # подставим переменные в скрипт deploy.sh и выполним его на целевом хосте, где развернем сосисочный бэкенд
    - apk add gettext
    - envsubst < ./backend/deploy.sh|ssh ${DEV_USER}@${DEV_HOST}
  needs:
    - job: upload-backend-release

telegram-notification-backend:
  stage: notify
  when: manual
  variables:
    WATERMARK: "☺"
#  only:
#    changes:
#      - backend/**/*
  script:
    - >
      curl -X POST
      -H 'Content-type: application/json'
      -d '{"chat_id": "-1002558070233", "text": "Backend deployed with Docker compose '$WATERMARK'"}'
      https://api.telegram.org/bot5933756043:AAE8JLL5KIzgrNBeTP5e-1bkbJy4YRoeGjs/sendMessage
  needs:
    - job: deploy-backend
