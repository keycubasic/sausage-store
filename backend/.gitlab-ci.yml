stages:
  - build
  - test
  - notify

variables:
  WATERMARK: "☺"

build-backend-code-job:
  stage: build
  cache:
    paths:
      - ${MAVEN_REPO_PATH}
  script:
    - cd backend
    - mvn package
  artifacts:
    paths:
      - backend/target/sausage-store-0.0.1-SNAPSHOT.jar
  rules:
    - changes:
        - backend/**/*

semgrep-sast:
  stage: test
  variables:
    COMPILE: ${COMPILE}
    SAST_JAVA_VERSION: ${SAST_JAVA_VERSION}
    MAVEN_REPO_PATH: ${MAVEN_REPO_PATH}
  needs:
    - job: build-backend-code-job

telegram-notification-backend:
  stage: notify
  only:
    changes:
      - backend/**/*
  script:
    - >
      curl -X POST
      -H 'Content-type: application/json'
      -d '{"chat_id": "-1002558070233", "text": "Backend built '$WATERMARK': '$CI_PROJECT_URL'/-/jobs/artifacts/'$CI_COMMIT_SHA'/download?job=build-backend-code-job"}'
      https://api.telegram.org/bot5933756043:AAE8JLL5KIzgrNBeTP5e-1bkbJy4YRoeGjs/sendMessage
  needs:
    - job: semgrep-sast
