stages:
  - build
  - test
  - release
  - notify

variables:
  VERSION: 1.0.${CI_PIPELINE_ID}

build-frontend-code-job:
  stage: build
  cache:
    paths:
      - .npm/
  script:
    - cd frontend
    - npm install
    - npm run build
  artifacts:
    paths:
      - frontend/dist/frontend
  rules:
#    - if: $CI_COMMIT_MESSAGE =~ /send notification/
    - changes:
        - frontend/**/*

sonarqube-front-sast:
  stage: test
  image: sonarsource/sonar-scanner-cli
  script:
    - cd frontend
    - >
      sonar-scanner
      -Dsonar.qualitygate.wait=true
      -Dsonar.projectKey=${SONAR_PROJECT_KEY_FRONT}
      -Dsonar.sources=.
      -Dsonar.host.url=${SONARQUBE_URL}
      -Dsonar.login=${SONAR_LOGIN}
  rules:
    - changes:
        - frontend/**/*
  needs:
    - job: build-frontend-code-job

upload-frontend-release:
  stage: release
  only:
    changes:
      - frontend/**/*
  script:
    - cd frontend/dist
    - tar czvf sausage-store-${VERSION}.tar.gz frontend
    - >
      curl -v -u "${NEXUS_REPO_USER}:${NEXUS_REPO_PASS}"
      --upload-file sausage-store-${VERSION}.tar.gz
      ${NEXUS_REPO_URL}/repository/${NEXUS_REPO_FRONTEND_NAME}/${VERSION}/sausage-store-${VERSION}.tar.gz
  needs:
    - job: sonarqube-front-sast

telegram-notification-frontend:
  stage: notify
  variables:
    WATERMARK: "☺"
  only:
    changes:
      - frontend/**/*
  script:
    - >
      curl -X POST
      -H 'Content-type: application/json'
      -d '{"chat_id": "-1002558070233", "text": "Fronted uploaded to Nexus '$WATERMARK': '$NEXUS_REPO_URL'/#browse/browse:'$NEXUS_REPO_FRONTEND_NAME'"}'
      https://api.telegram.org/bot5933756043:AAE8JLL5KIzgrNBeTP5e-1bkbJy4YRoeGjs/sendMessage
  needs:
    - job: upload-frontend-release
