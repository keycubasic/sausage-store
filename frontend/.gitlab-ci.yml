stages:
  - build
  - test
  - release
  - deploy
  - notify

#variables:
#  VERSION: 1.0.${CI_PIPELINE_ID}

cache:
  paths:
    - frontend/dist/frontend

build-frontend-code-job:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.9.0-debug
    entrypoint: [""]
  # переменные CI_REGISTRY_USER, CI_REGISTRY_PASSWORD, CI_REGISTRY генерятся Гитлабом, их задавать не надо
  script:
    - echo "test"
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/frontend"
      --dockerfile "${CI_PROJECT_DIR}/frontend/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}/sausage-frontend:$CI_COMMIT_SHA"
      --build-arg VERSION=$VERSION
      --cache=true
#  rules:
#    - changes:
#        - frontend/**/*

sonarqube-front-sast:
  stage: test
  image: sonarsource/sonar-scanner-cli
  script:
    - cd frontend
    - >
      sonar-scanner
      -Dsonar.qualitygate.wait=true
      -Dsonar.projectKey=${SONAR_PROJECT_KEY_FRONT}
      -Dsonar.sources=.
      -Dsonar.host.url=${SONARQUBE_URL}
      -Dsonar.login=${SONAR_LOGIN}
#  rules:
#    - changes:
#        - frontend/**/*
  needs:
    - job: build-frontend-code-job

upload-frontend-release:
  stage: release
  variables:
    GIT_STRATEGY: none
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [ "" ]
  cache: [ ]
  before_script:
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - crane tag $CI_REGISTRY_IMAGE/sausage-frontend:$CI_COMMIT_SHA $VERSION
#  only:
#    changes:
#      - frontend/**/*
  needs:
    - job: sonarqube-front-sast

deploy-frontend:
  stage: deploy
#  when: manual
  image: nginx:stable-alpine3.17-slim
  before_script:
    - apk add openssh-client bash
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    # подкинуть конфиг Nginx
    - scp ./frontend/default.conf ${DEV_USER}@${DEV_HOST}:/tmp${CI_PROJECT_DIR}/frontend/
    #- ssh ${DEV_USER}@${DEV_HOST} "chmod 777 /tmp${CI_PROJECT_DIR}/frontend/default.conf"
  script:
    # подставим переменные в скрипт deploy.sh и выполним его на целевом хосте, где развернем сосисочный бэкенд
    - apk add gettext
    #- envsubst < ./frontend/deploy.sh|ssh ${DEV_USER}@${DEV_HOST}
  needs:
    - job: upload-frontend-release

telegram-notification-frontend:
  stage: notify
  when: manual
  variables:
    WATERMARK: "☺"
#  only:
#    changes:
#      - frontend/**/*
  script:
    - >
      curl -X POST
      -H 'Content-type: application/json'
      -d '{"chat_id": "-1002558070233", "text": "Frontend deployed with Blue-green strategy '$WATERMARK'"}'
      https://api.telegram.org/bot5933756043:AAE8JLL5KIzgrNBeTP5e-1bkbJy4YRoeGjs/sendMessage
  needs:
    - job: deploy-frontend
