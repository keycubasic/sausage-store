stages:
  - build
  - notify

build-frontend-code-job:
  stage: build
  script:
    - cd frontend
    - npm install
    - npm run build
  artifacts:
    paths:
      - frontend/dist/frontend
  rules:
    - if: $CI_COMMIT_MESSAGE =~ "send notification"
      changes:
        - backend/**/*

telegram-notification-frontend:
  stage: notify
  only:
    changes:
      - frontend/**/*
  script:
    - >
      curl -X POST \
      -H 'Content-type: application/json' \
      -d '{"chat_id": "-1002558070233", "text": "Frontend built: '$CI_PROJECT_URL'/-/jobs/artifacts/'$CI_COMMIT_SHA'/download?job='$CI_JOB_NAME'"}' \
      https://api.telegram.org/bot5933756043:AAE8JLL5KIzgrNBeTP5e-1bkbJy4YRoeGjs/sendMessage

